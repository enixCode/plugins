<style>
:root {
  --paper: #fafaf7;
  --paper-2: #f0efea;
  --paper-3: #e8e6df;
  --ink: #050505;
  --ink-soft: #2a2a28;
  --rule: #050505;
  --rule-soft: #d4d2cb;
  --hot: #ff2d2d;
  --blue: #0033ff;
  --yellow: #ffd400;
  --muted: #8a8a82;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Archivo', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
::selection { background: var(--hot); color: var(--paper); }

.grid-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.025) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.025) 1px, transparent 1px);
  background-size: 80px 80px;
}

main { position: relative; z-index: 1; }

/* ────────── topbar ────────── */
.topbar {
  border-bottom: 2px solid var(--rule);
  padding: 12px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 12px;
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .left { display: flex; gap: 14px; align-items: center; }
.topbar .dot { width: 8px; height: 8px; background: var(--hot); display: inline-block; }
.topbar .right { display: flex; gap: 18px; color: var(--muted); }
.topbar .right a { color: var(--ink); }
.topbar a:hover { color: var(--hot); }

/* ────────── hero ────────── */
.hero {
  padding: 32px 28px 28px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 36px;
  border-bottom: 4px solid var(--rule);
  align-items: end;
}
.hero h1 {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: clamp(40px, 6vw, 76px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero h1 .ital {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-style: italic;
  text-transform: lowercase;
  font-size: 0.78em;
  color: var(--hot);
  letter-spacing: -0.02em;
}
.hero .lead {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(15px, 1.5vw, 20px);
  line-height: 1.3;
  max-width: 38ch;
  color: var(--ink-soft);
  margin-bottom: 14px;
}
.hero .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 500;
  color: var(--muted);
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}
.hero .meta b { color: var(--ink); font-weight: 700; }

.hero-install {
  background: var(--ink);
  color: var(--paper);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hero-install .label {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--yellow);
}
.hero-install .cmd {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: clamp(13px, 1.3vw, 16px);
  width: 100%;
  text-align: left;
  letter-spacing: -0.005em;
  word-break: break-all;
  color: var(--paper);
}
.hero-install .cmd::before { content: "$ "; color: var(--yellow); }
.hero-install .cmd:hover { color: var(--yellow); }
.hero-install .copy-btn {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  background: var(--paper);
  color: var(--ink);
  padding: 7px 12px;
  align-self: flex-start;
  margin-top: 4px;
  transition: all 140ms ease;
}
.hero-install .copy-btn:hover { background: var(--yellow); }
.hero-install.copied .copy-btn { background: var(--hot); color: var(--paper); }
.hero-install.copied .copy-btn::after { content: " ✓"; }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; gap: 18px; padding: 22px 18px; align-items: stretch; }
  .topbar { padding: 10px 18px; flex-wrap: wrap; gap: 8px; }
  .topbar .right { gap: 12px; }
}

/* ────────── catalogue header ────────── */
.sec-head {
  padding: 22px 28px 14px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--rule);
}
.sec-head h2 {
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.18em;
}
.sec-head .count {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--muted);
}
.sec-head .count b { color: var(--hot); font-weight: 600; font-style: normal; }

/* ────────── plugin card ────────── */
.plugin {
  padding: 36px 28px;
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 28px;
  position: relative;
}
.plugin:nth-child(odd) { background: transparent; }
.plugin:nth-child(even) { background: var(--paper-2); }

.plugin .gutter .num {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 900;
  font-size: 72px;
  line-height: 0.85;
  letter-spacing: -0.04em;
}
.plugin .gutter .num small {
  display: block;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 14px;
  color: var(--muted);
  margin-top: 10px;
  letter-spacing: 0;
}

.plugin .body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.plugin h3 {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 900;
  font-size: clamp(34px, 4.6vw, 56px);
  line-height: 0.92;
  text-transform: uppercase;
  letter-spacing: -0.03em;
}

.metarow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.14em;
  font-weight: 500;
  color: var(--muted);
}
.metarow .badge {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.18em;
  padding: 4px 10px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  white-space: nowrap;
}
.metarow .badge.full { background: var(--hot); color: var(--paper); border-color: var(--hot); }
.metarow .badge.solo { background: var(--yellow); color: var(--ink); border-color: var(--ink); }
.metarow .badge.pending {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--ink);
}
.metarow .sep { color: var(--rule-soft); }
.metarow b { color: var(--ink); font-weight: 700; }

.plugin .desc {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(16px, 1.6vw, 19px);
  line-height: 1.4;
  max-width: 60ch;
  color: var(--ink-soft);
}

/* install */
.install {
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--ink);
  color: var(--paper);
  max-width: 540px;
}
.install .cmd {
  flex: 1;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 14px;
  padding: 12px 16px;
  text-align: left;
  letter-spacing: -0.005em;
  color: var(--paper);
  word-break: break-all;
}
.install .cmd::before { content: "$ "; color: var(--yellow); }
.install .copy-btn {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  padding: 12px 16px;
  background: var(--paper);
  color: var(--ink);
  border-left: 2px solid var(--ink);
  transition: background 140ms ease, color 140ms ease;
  white-space: nowrap;
}
.install .copy-btn:hover { background: var(--yellow); }
.install.copied .copy-btn { background: var(--hot); color: var(--paper); border-color: var(--hot); }
.install.copied .copy-btn::after { content: " ✓"; }

/* setup disclosure */
details.setup {
  border-top: 1px dashed var(--rule);
  border-bottom: 1px dashed var(--rule);
  padding: 14px 0;
  max-width: 700px;
}
details.setup summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink);
}
details.setup summary::-webkit-details-marker { display: none; }
details.setup summary::after {
  content: "+ expand";
  font-family: 'Archivo Narrow', sans-serif;
  color: var(--hot);
  font-weight: 700;
}
details.setup[open] summary::after { content: "− collapse"; }
details.setup .setup-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
details.setup .setup-note {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 13.5px;
  color: var(--muted);
  margin-top: 4px;
}
.subcmd {
  display: flex;
  align-items: stretch;
  background: var(--paper-3);
  border-left: 3px solid var(--ink);
}
.subcmd .cmd {
  flex: 1;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 13px;
  padding: 9px 14px;
  text-align: left;
  word-break: break-all;
  letter-spacing: -0.005em;
}
.subcmd .cmd::before { content: "$ "; color: var(--hot); }
.subcmd .copy-btn {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  padding: 9px 12px;
  color: var(--muted);
  border-left: 1px solid var(--rule-soft);
  transition: color 140ms ease, background 140ms ease;
}
.subcmd .copy-btn:hover { color: var(--ink); background: var(--paper-2); }
.subcmd.copied .copy-btn { color: var(--hot); }
.subcmd.copied .copy-btn::after { content: " ✓"; }

/* specs */
.specs {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 6px 18px;
  font-size: 13px;
  border-top: 1px solid var(--rule-soft);
  padding-top: 14px;
}
.specs dt {
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.16em;
  font-weight: 700;
  color: var(--muted);
  padding-top: 3px;
}
.specs dd code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12px;
  background: var(--paper);
  border: 1px solid var(--rule-soft);
  padding: 1px 7px;
  margin: 0 4px 4px 0;
  display: inline-block;
}
.plugin:nth-child(even) .specs dd code { background: var(--paper); }

/* CTA row */
.cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  align-items: center;
  padding-top: 6px;
}
.cta-row .primary {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  background: var(--ink);
  color: var(--paper);
  padding: 12px 22px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: background 140ms ease;
}
.cta-row .primary::after { content: "↗"; font-family: 'Archivo', sans-serif; font-size: 16px; }
.cta-row .primary:hover { background: var(--hot); }
.cta-row .secondary {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 2px;
  transition: color 140ms ease, border-color 140ms ease;
}
.cta-row .secondary::after { content: " ↗"; }
.cta-row .secondary:hover { color: var(--hot); border-color: var(--hot); }

@media (max-width: 720px) {
  .plugin { grid-template-columns: 1fr; padding: 28px 18px; gap: 18px; }
  .plugin .gutter .num { font-size: 56px; }
  .install { max-width: none; }
  .specs { grid-template-columns: 1fr; gap: 2px 0; }
  .specs dt { padding-top: 12px; }
}

/* footer */
footer {
  padding: 28px;
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--muted);
  border-top: 4px solid var(--rule);
}
footer .glyph {
  font-family: 'Fraunces', serif;
  font-style: italic;
  text-transform: none;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
footer a:hover { color: var(--hot); }

/* a11y: focus visibility */
:focus-visible {
  outline: 2px solid var(--hot);
  outline-offset: 2px;
}
</style>
</head>

    <span>enixCode</span>

<script>
// ────────────────────────────────────────────────────────────────────────
// Plugins data — to add a new plugin, add an object to this array.
// All optional fields can be omitted (setup, badges.pending, ctas.docs).
// ────────────────────────────────────────────────────────────────────────
const plugins = [
  {
    id: 'light-process',
    state: 'shipping',
    name: 'light-process',
    kind: { label: 'plugin + cli', tone: 'full', title: 'Plugin + standalone CLI/server you also install via npm' },
    pending: false,
    version: '0.5.1',
    license: 'AGPL-3.0',
    metaSummary: '<b>5</b> skills',
    description: 'A lightweight DAG workflow engine. Orchestrates code that runs in Docker containers, connected by links with conditions. Container execution is delegated to a separate light-run HTTP service.',
    install: '/plugin install light-process@enix',
    setup: {
      summary: 'Setup the engine — required to run workflows',
      noteTop: 'The plugin gives Claude five skills. To actually execute workflows, install the npm packages and start the runner.',
      commands: [
        'npm install -g light-process @enixcode/light-run',
        'light serve'
      ],
      noteBottom: 'Requires Node 20+ and Docker on the host running light-run.'
    },
    specs: {
      Skills: ['context', 'create-workflow', 'add-node', 'setup-light-run', 'remote'],
      Stack:  'light-process · light-run · light-runner · Docker',
      Runtime: 'Node 20+ · ESM · TypeScript'
    },
    ctas: {
      project: 'https://github.com/enixCode/light-process',
      readme:  'https://github.com/enixCode/light-process#readme',
      docs:    'https://enixcode.github.io/light-process/'
    }
  },
  {
    id: 'ulab',
    state: 'fresh',
    name: 'ulab',
    kind: { label: 'plugin', tone: 'solo', title: 'Plugin only — no separate install required' },
    pending: true,
    version: '0.1.0',
    license: 'MIT',
    metaSummary: '<b>3</b> skills · <b>2</b> agents · <b>5</b> commands',
    description: 'Scaffolds a learning lab on any topic. You give a free-form subject; ulab picks the right runtime, generates a progressive curriculum with cited sources, and ships hidden solutions. Tutor mode included.',
    install: '/plugin install ulab@enix',
    setup: null,
    specs: {
      Commands: ['/ulab:new', '/ulab:list', '/ulab:learner', '/ulab:reset', '/ulab:publish'],
      Skills:   ['lab-scaffolder', 'lab-learner', 'lab-debug'],
      Agents:   ['lab-researcher', 'lab-builder']
    },
    ctas: {
      project: 'https://github.com/enixCode/ulab',
      readme:  'https://github.com/enixCode/ulab#readme'
    }
  }
];

// ────────────────────────────────────────────────────────────────────────
// Render
// ────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const num2 = (n) => String(n).padStart(2, '0');

const renderSubcmd = (cmd, key) => `
  <div class="subcmd" id="${key}">
    <button class="cmd" data-copy="${esc(cmd)}" data-host="${key}" aria-label="Copy: ${esc(cmd)}" type="button">${esc(cmd)}</button>
    <button class="copy-btn" data-copy="${esc(cmd)}" data-host="${key}" type="button">copy</button>
  </div>`;

const renderSetup = (p) => {
  if (!p.setup) return '';
  const subs = p.setup.commands
    .map((c, i) => renderSubcmd(c, `${p.id}-sub-${i}`))
    .join('');
  return `
    <details class="setup">
      <summary>${esc(p.setup.summary)}</summary>
      <div class="setup-body">
        ${p.setup.noteTop ? `<p class="setup-note">${esc(p.setup.noteTop)}</p>` : ''}
        ${subs}
        ${p.setup.noteBottom ? `<p class="setup-note">${esc(p.setup.noteBottom)}</p>` : ''}
      </div>
    </details>`;
};

const renderSpecValue = (v) => {
  if (Array.isArray(v)) return v.map((x) => `<code>${esc(x)}</code>`).join('');
  return esc(v);
};

const renderSpecs = (specs) => {
  const rows = Object.entries(specs)
    .map(([k, v]) => `<dt>${esc(k)}</dt><dd>${renderSpecValue(v)}</dd>`)
    .join('');
  return `<dl class="specs">${rows}</dl>`;
};

const renderCtas = (c) => {
  const items = [];
  if (c.project) items.push(`<a class="primary" href="${esc(c.project)}" target="_blank" rel="noopener">Open project</a>`);
  if (c.readme)  items.push(`<a class="secondary" href="${esc(c.readme)}" target="_blank" rel="noopener">Readme</a>`);
  if (c.docs)    items.push(`<a class="secondary" href="${esc(c.docs)}" target="_blank" rel="noopener">Docs site</a>`);
  return `<div class="cta-row">${items.join('')}</div>`;
};

const renderMetarow = (p) => {
  const parts = [];
  parts.push(`<span class="badge ${esc(p.kind.tone)}" title="${esc(p.kind.title)}">${esc(p.kind.label)}</span>`);
  if (p.pending) parts.push(`<span class="badge pending">repo pending</span>`);
  parts.push(`<span>v ${esc(p.version)}</span>`);
  parts.push(`<span class="sep">·</span>`);
  parts.push(`<span>${esc(p.license)}</span>`);
  if (p.metaSummary) {
    parts.push(`<span class="sep">·</span>`);
    parts.push(`<span>${p.metaSummary}</span>`);
  }
  return `<div class="metarow">${parts.join('')}</div>`;
};

const renderPlugin = (p, i) => {
  const slug = p.id.replace(/[^a-z0-9]/gi, '-');
  return `
    <article class="plugin" aria-labelledby="p-${slug}">
      <div class="gutter">
        <div class="num">${num2(i + 1)}<small>${esc(p.state || '')}</small></div>
      </div>
      <div class="body">
        <h2 id="p-${slug}">${esc(p.name).replace('-', '<wbr>-')}</h2>
        ${renderMetarow(p)}
        <p class="desc">${esc(p.description)}</p>
        <div class="install" id="${slug}-install">
          <button class="cmd" data-copy="${esc(p.install)}" data-host="${slug}-install" aria-label="Copy: ${esc(p.install)}" type="button">${esc(p.install)}</button>
          <button class="copy-btn" data-copy="${esc(p.install)}" data-host="${slug}-install" type="button">copy</button>
        </div>
        ${renderSetup({ ...p, id: slug })}
        ${renderSpecs(p.specs)}
        ${renderCtas(p.ctas)}
      </div>
    </article>`;
};

const mount = document.getElementById('catalogue');
mount.innerHTML = plugins.map(renderPlugin).join('');

// keep counts in sync
document.querySelectorAll('[data-count]').forEach((el) => {
  el.textContent = num2(plugins.length);
});

// ────────────────────────────────────────────────────────────────────────
// Copy buttons
// ────────────────────────────────────────────────────────────────────────
(() => {
  const flash = (el) => {
    const host = el.dataset.host ? document.getElementById(el.dataset.host) : el;
    const target = host || el;
    target.classList.add('copied');
    setTimeout(() => target.classList.remove('copied'), 1500);
  };
  document.querySelectorAll('[data-copy]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const text = btn.getAttribute('data-copy');
      try {
        await navigator.clipboard.writeText(text);
        flash(btn);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); flash(btn); } catch {}
        document.body.removeChild(ta);
      }
    });
  });
})();
</script>

</body>
</html>
