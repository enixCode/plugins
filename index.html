})();

<style>
/* Tokens importés depuis https://enixcode.github.io/da/tokens.css
   (palette + dark mode + theme-toggle override).
   Pour modifier la palette : éditer le repo enixCode/da, push, refresh ici. */

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Archivo', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.skiplink {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--mark-bg);
  color: var(--mark-fg);
  padding: 12px 18px;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.16em;
  z-index: 1000;
}
.skiplink:focus { left: 12px; top: 12px; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
::selection { background: var(--hot); color: var(--paper); }

.grid-bg {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 80px 80px;
}

main { position: relative; z-index: 1; }

/* ────────── topbar ────────── */
.topbar {
  border-bottom: 2px solid var(--rule);
  padding: 12px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 12px;
  background: var(--paper);
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .left { display: flex; gap: 14px; align-items: center; }
.topbar .dot { width: 8px; height: 8px; background: var(--hot); display: inline-block; }
.topbar .right { display: flex; gap: 18px; color: var(--muted); align-items: center; }
.topbar .right a { color: var(--ink); }
.topbar a:hover { color: var(--hot); }

.theme-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  padding: 4px 6px;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
  min-height: 28px;
}
.theme-toggle:hover { background: var(--mark-bg); color: var(--mark-fg); }
.theme-toggle .opt {
  padding: 4px 8px;
  border-radius: 0;
  opacity: 0.4;
  transition: opacity 140ms ease;
}
.theme-toggle .opt.active {
  opacity: 1;
  background: var(--mark-bg);
  color: var(--mark-fg);
}
.theme-toggle:hover .opt:not(.active) { color: var(--mark-fg); }

.view-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  padding: 4px 6px;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
  min-height: 28px;
}
.view-toggle:hover { background: var(--mark-bg); color: var(--mark-fg); }
.view-toggle .opt {
  padding: 4px 8px;
  opacity: 0.4;
  transition: opacity 140ms ease;
}
.view-toggle .opt.active {
  opacity: 1;
  background: var(--mark-bg);
  color: var(--mark-fg);
}
.view-toggle:hover .opt:not(.active) { color: var(--mark-fg); }

/* ────────── view modes ────────── */

/* GRID: 2 cards per row max, all info kept */
:root[data-view="grid"] #catalogue {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
}
:root[data-view="grid"] .plugin {
  padding: 28px 24px;
  border-right: 1px solid var(--rule);
}
:root[data-view="grid"] .plugin:nth-child(even) {
  background: transparent;
}
:root[data-view="grid"] .plugin .gutter .num {
  font-size: 56px;
}
:root[data-view="grid"] .plugin h2 {
  font-size: clamp(28px, 3vw, 40px);
}

/* LIST: compact one-row-per-plugin */
:root[data-view="list"] .plugin {
  padding: 12px 28px;
  grid-template-columns: 50px 1fr;
  gap: 18px;
  align-items: center;
}
:root[data-view="list"] .plugin .gutter .num {
  font-size: 24px;
  letter-spacing: -0.02em;
}
:root[data-view="list"] .plugin .gutter .num small {
  display: none;
}
:root[data-view="list"] .plugin .body {
  flex-direction: row;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 18px;
}
:root[data-view="list"] .plugin h2 {
  font-size: 22px;
  line-height: 1;
}
:root[data-view="list"] .plugin .desc,
:root[data-view="list"] .plugin .install,
:root[data-view="list"] .plugin details.setup,
:root[data-view="list"] .plugin .specs {
  display: none;
}
:root[data-view="list"] .plugin .metarow {
  font-size: 10.5px;
}
:root[data-view="list"] .plugin .metarow .badge {
  padding: 3px 8px;
}
:root[data-view="list"] .plugin .cta-row {
  margin-left: auto;
  padding-top: 0;
  gap: 8px 16px;
}
:root[data-view="list"] .plugin .cta-row .primary {
  padding: 8px 14px;
  font-size: 11px;
}
:root[data-view="list"] .plugin .cta-row .secondary {
  font-size: 11px;
}

@media (max-width: 720px) {
  :root[data-view="grid"] #catalogue { grid-template-columns: 1fr; }
  :root[data-view="list"] .plugin .cta-row { margin-left: 0; }
}

/* ────────── hero ────────── */
.hero {
  padding: 32px 28px 28px;
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 36px;
  border-bottom: 4px solid var(--rule);
  align-items: end;
}
.hero h1 {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: clamp(40px, 6vw, 76px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero h1 .ital {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-style: italic;
  text-transform: lowercase;
  font-size: 0.78em;
  color: var(--hot);
  letter-spacing: -0.02em;
}
.hero .lead {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-style: italic;
  font-size: clamp(16px, 1.6vw, 21px);
  line-height: 1.35;
  max-width: 40ch;
  color: var(--ink);
  margin-bottom: 14px;
}
.hero .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 500;
  color: var(--muted);
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}
.hero .meta b { color: var(--ink); font-weight: 700; }

.hero-install {
  background: var(--mark-bg);
  color: var(--mark-fg);
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hero-install .label {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--yellow);
}
.hero-install .cmd {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: clamp(13px, 1.3vw, 16px);
  width: 100%;
  text-align: left;
  letter-spacing: -0.005em;
  word-break: break-all;
  color: var(--mark-fg);
}
.hero-install .cmd::before { content: "$ "; color: var(--yellow); }
.hero-install .cmd:hover { color: var(--yellow); }
.hero-install .copy-btn {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  background: var(--mark-fg);
  color: var(--mark-bg);
  padding: 11px 18px;
  min-height: 44px;
  align-self: flex-start;
  margin-top: 4px;
  transition: all 140ms ease;
}
.hero-install .copy-btn:hover { background: var(--yellow); color: var(--constant-ink); }
.hero-install.copied .copy-btn { background: var(--hot); color: var(--constant-paper); }
.hero-install.copied .copy-btn::after { content: " ✓"; }

@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; gap: 18px; padding: 22px 18px; align-items: stretch; }
  .topbar { padding: 10px 18px; flex-wrap: wrap; gap: 8px; }
  .topbar .right { gap: 12px; }
}

/* ────────── catalogue header ────────── */
.sec-head {
  padding: 22px 28px 14px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--rule);
}
.sec-head h2 {
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.18em;
}
.sec-head .count {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 17px;
  color: var(--muted);
}
.sec-head .count b { color: var(--hot); font-weight: 600; font-style: normal; }

/* ────────── plugin card ────────── */
.plugin {
  padding: 36px 28px;
  border-bottom: 1px solid var(--rule);
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 28px;
  position: relative;
}
.plugin:nth-child(odd) { background: transparent; }
.plugin:nth-child(even) { background: var(--paper-2); }

.plugin .gutter .num {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 900;
  font-size: 72px;
  line-height: 0.85;
  letter-spacing: -0.04em;
}
.plugin .gutter .num small {
  display: block;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 14px;
  color: var(--muted);
  margin-top: 10px;
  letter-spacing: 0;
}

.plugin .body {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.plugin h3 {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 900;
  font-size: clamp(34px, 4.6vw, 56px);
  line-height: 0.92;
  text-transform: uppercase;
  letter-spacing: -0.03em;
}

.metarow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.14em;
  font-weight: 500;
  color: var(--muted);
}
.metarow .badge {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.18em;
  padding: 4px 10px;
  border: 1.5px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  white-space: nowrap;
}
.metarow .badge.full {
  background: var(--hot);
  color: var(--constant-paper);
  border-color: var(--hot);
}
.metarow .badge.solo {
  background: var(--yellow);
  color: var(--constant-ink);
  border-color: var(--constant-ink);
}
.metarow .badge.pending {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--ink);
}
.metarow .sep { color: var(--rule-soft); }
.metarow b { color: var(--ink); font-weight: 700; }

.plugin .desc {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(16px, 1.5vw, 18px);
  line-height: 1.55;
  max-width: 64ch;
  color: var(--ink);
  font-feature-settings: "ss01", "kern";
}

/* install */
.install {
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--mark-bg);
  color: var(--mark-fg);
  max-width: 540px;
}
.install .cmd {
  flex: 1;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 14px;
  padding: 12px 16px;
  text-align: left;
  letter-spacing: -0.005em;
  color: var(--mark-fg);
  word-break: break-all;
}
.install .cmd::before { content: "$ "; color: var(--yellow); }
.install .copy-btn {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  padding: 14px 20px;
  min-height: 44px;
  background: var(--mark-fg);
  color: var(--mark-bg);
  border-left: 2px solid var(--mark-bg);
  transition: background 140ms ease, color 140ms ease;
  white-space: nowrap;
}
.install .copy-btn:hover { background: var(--yellow); color: var(--constant-ink); }
.install.copied .copy-btn { background: var(--hot); color: var(--constant-paper); border-color: var(--hot); }
.install.copied .copy-btn::after { content: " ✓"; }

/* setup disclosure */
details.setup {
  border-top: 1px dashed var(--rule);
  border-bottom: 1px dashed var(--rule);
  padding: 14px 0;
  max-width: 700px;
}
details.setup summary {
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--ink);
}
details.setup summary::-webkit-details-marker { display: none; }
details.setup summary::after {
  content: "+ expand";
  font-family: 'Archivo Narrow', sans-serif;
  color: var(--hot);
  font-weight: 700;
}
details.setup[open] summary::after { content: "− collapse"; }
details.setup .setup-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 12px;
}
details.setup .setup-note {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-soft);
  margin-top: 4px;
}
.subcmd {
  display: flex;
  align-items: stretch;
  background: var(--paper-3);
  border-left: 3px solid var(--ink);
}
.subcmd .cmd {
  flex: 1;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-weight: 500;
  font-size: 13px;
  padding: 9px 14px;
  text-align: left;
  word-break: break-all;
  letter-spacing: -0.005em;
}
.subcmd .cmd::before { content: "$ "; color: var(--hot); }
.subcmd .copy-btn {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  padding: 9px 12px;
  color: var(--muted);
  border-left: 1px solid var(--rule-soft);
  transition: color 140ms ease, background 140ms ease;
}
.subcmd .copy-btn:hover { color: var(--ink); background: var(--paper-2); }
.subcmd.copied .copy-btn { color: var(--hot); }
.subcmd.copied .copy-btn::after { content: " ✓"; }

/* specs */
.specs {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 6px 18px;
  font-size: 13px;
  border-top: 1px solid var(--rule-soft);
  padding-top: 14px;
}
.specs dt {
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.16em;
  font-weight: 700;
  color: var(--muted);
  padding-top: 3px;
}
.specs dd code {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 12px;
  background: var(--paper);
  border: 1px solid var(--rule-soft);
  padding: 1px 7px;
  margin: 0 4px 4px 0;
  display: inline-block;
}
.plugin:nth-child(even) .specs dd code { background: var(--paper); }

/* CTA row */
.cta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 22px;
  align-items: center;
  padding-top: 6px;
}
.cta-row .primary {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  background: var(--mark-bg);
  color: var(--mark-fg);
  padding: 12px 22px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  transition: background 140ms ease;
}
.cta-row .primary::after { content: "↗"; font-family: 'Archivo', sans-serif; font-size: 16px; }
.cta-row .primary:hover { background: var(--hot); color: var(--constant-paper); }
.cta-row .secondary {
  font-family: 'Archivo Narrow', sans-serif;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 2px;
  transition: color 140ms ease, border-color 140ms ease;
}
.cta-row .secondary::after { content: " ↗"; }
.cta-row .secondary:hover { color: var(--hot); border-color: var(--hot); }

@media (max-width: 720px) {
  .plugin { grid-template-columns: 1fr; padding: 28px 18px; gap: 18px; }
  .plugin .gutter .num { font-size: 56px; }
  .install { max-width: none; }
  .specs { grid-template-columns: 1fr; gap: 2px 0; }
  .specs dt { padding-top: 12px; }
}

/* footer */
footer {
  padding: 28px;
  font-family: 'Archivo Narrow', sans-serif;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  color: var(--muted);
  border-top: 4px solid var(--rule);
}
footer .glyph {
  font-family: 'Fraunces', serif;
  font-style: italic;
  text-transform: none;
  font-size: 20px;
  color: var(--ink);
  letter-spacing: -0.01em;
}
footer a:hover { color: var(--hot); }

/* a11y: focus visibility */
:focus-visible {
  outline: 2px solid var(--hot);
  outline-offset: 2px;
}
</style>
</head>
<body>

<a class="skiplink" href="#main">Skip to content</a>

<header class="topbar">
  <div class="left">
    <span class="dot" aria-hidden="true"></span>
    <span>enixCode</span>
    <span>/ plugins</span>
  </div>
  <nav class="right" aria-label="Marketplace meta">
    <span><b data-count></b> plugins</span>
    <a href="https://github.com/enixCode/plugins" target="_blank" rel="noopener">GitHub ↗</a>
    <button class="view-toggle" id="view-toggle" aria-label="Switch layout" type="button">
      <span class="opt" data-view-set="detail">detail</span>
      <span class="opt" data-view-set="list">list</span>
      <span class="opt" data-view-set="grid">grid</span>
    </button>
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch theme" type="button">
      <span class="opt" data-theme-set="auto">auto</span>
      <span class="opt" data-theme-set="light">light</span>
      <span class="opt" data-theme-set="dark">dark</span>
    </button>
  </nav>
</header>

<main id="main">

  <section class="hero" aria-labelledby="site-title">
    <div>
      <h1 id="site-title">enix<span class="ital">/</span>plugins</h1>
      <p class="lead">A small, opinionated marketplace for Claude Code. Lean tools. No fluff. Read the source.</p>
      <div class="meta">
        <span><b data-count></b> plugins</span>
        <span>by <b>enixCode</b></span>
        <span>updated <b>may 2026</b></span>
      </div>
    </div>
    <div class="hero-install" id="install-hero">
      <span class="label">Install once</span>
      <button class="cmd" data-copy="/plugin marketplace add enixCode/plugins" data-host="install-hero" aria-label="Copy: /plugin marketplace add enixCode/plugins" type="button">/plugin marketplace add enixCode/plugins</button>
      <button class="copy-btn" data-copy="/plugin marketplace add enixCode/plugins" data-host="install-hero" type="button">copy</button>
    </div>
  </section>

  <div class="sec-head">
    <h2>// Catalogue</h2>
    <span class="count"><b data-count></b> entries</span>
  </div>

  <section id="catalogue" aria-label="Plugins"></section>

  <footer>
    <span><a href="https://github.com/enixCode/plugins" target="_blank" rel="noopener">enixCode/plugins</a> · 2026</span>
    <span>built with claude code</span>
  </footer>

</main>

<script>
// ────────────────────────────────────────────────────────────────────────
// Theme toggle (auto / light / dark)
// ────────────────────────────────────────────────────────────────────────
(() => {
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  if (!toggle) return;
  const opts = toggle.querySelectorAll('[data-theme-set]');

  const sync = () => {
    const stored = localStorage.getItem('theme'); // 'light' | 'dark' | null
    const current = stored || 'auto';
    opts.forEach((o) => o.classList.toggle('active', o.dataset.themeSet === current));
  };

  toggle.addEventListener('click', (e) => {
    const target = e.target.closest('[data-theme-set]');
    if (!target) {
      // bare click on the button: cycle
      const order = ['auto', 'light', 'dark'];
      const stored = localStorage.getItem('theme') || 'auto';
      const next = order[(order.indexOf(stored) + 1) % order.length];
      apply(next);
      return;
    }
    apply(target.dataset.themeSet);
  });

  const apply = (mode) => {
    if (mode === 'auto') {
      localStorage.removeItem('theme');
      root.removeAttribute('data-theme');
    } else {
      localStorage.setItem('theme', mode);
      root.setAttribute('data-theme', mode);
    }
    sync();
  };

  sync();
})();

// ────────────────────────────────────────────────────────────────────────
// Plugins config - only minimum site-specific fields here.
//
// At runtime, two fetches enrich each entry:
//   1. plugin.json (raw)        -> name, version, description, license
//   2. git tree (api.github)    -> skills/, commands/, agents/ lists
//
// If a fetch fails, the card renders in degraded mode (no counts/lists,
// but still shows kind + license + CTAs).  No visual error to the user.
//
// To add a plugin: append an entry below.
// ────────────────────────────────────────────────────────────────────────
const plugins = [
  {
    id: 'light-process',
    repo: 'enixCode/light-process',
    branch: 'main',
    pluginJsonPath: '.claude-plugin/plugin.json',
    kind: { label: 'plugin + cli', tone: 'full', title: 'Plugin + standalone CLI/server you also install via npm' },
    setup: {
      summary: 'Setup the engine - required to run workflows',
      noteTop: 'The plugin gives Claude skills. To actually execute workflows, install the npm packages and start the runner.',
      commands: [
        'npm install -g light-process @enixcode/light-run',
        'light serve'
      ],
      noteBottom: 'Requires Node 20+ and Docker on the host running light-run.'
    },
    staticSpecs: {
      Stack:   'light-process · light-run · light-runner · Docker',
      Runtime: 'Node 20+ · ESM · TypeScript'
    },
    docsUrl: 'https://enixcode.github.io/light-process/'
  },
  {
    id: 'ulab',
    repo: 'enixCode/ulab',
    branch: 'main',
    pluginJsonPath: 'plugins/ulab/.claude-plugin/plugin.json',
    kind: { label: 'plugin', tone: 'solo', title: 'Plugin only - no separate install required' },
    setup: null,
    staticSpecs: null,
    docsUrl: null
  },
  {
    id: 'rtk-plugin',
    repo: 'enixCode/rtk-plugin',
    branch: 'main',
    pluginJsonPath: '.claude-plugin/plugin.json',
    kind: { label: 'plugin + runtime', tone: 'full', title: 'Plugin + RTK binary auto-downloaded at SessionStart (requires Node 18+ and bash)' },
    setup: null,
    staticSpecs: {
      Runtime: 'Node 18+ · bash',
      Stack:   'RTK · SessionStart · PreToolUse(Bash)'
    },
    docsUrl: null
  }
];

// ────────────────────────────────────────────────────────────────────────
// Cache helpers (localStorage, 1h TTL by default)
// ────────────────────────────────────────────────────────────────────────
const ONE_HOUR = 60 * 60 * 1000;
const cacheGet = (key) => {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { value, expires } = JSON.parse(raw);
    if (expires < Date.now()) { localStorage.removeItem(key); return null; }
    return value;
  } catch { return null; }
};
const cacheSet = (key, value, ttl = ONE_HOUR) => {
  try { localStorage.setItem(key, JSON.stringify({ value, expires: Date.now() + ttl })); } catch {}
};

const escapeRegex = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const pluginPrefix = (p) => p.pluginJsonPath.replace(/\.claude-plugin\/plugin\.json$/, '');

// ────────────────────────────────────────────────────────────────────────
// Fetch plugin.json from raw.githubusercontent.com
// 200 -> live. Anything else -> pending.
// ────────────────────────────────────────────────────────────────────────
const fetchPluginManifest = async (p) => {
  const cacheKey = `manifest:${p.repo}@${p.branch}`;
  const cached = cacheGet(cacheKey);
  if (cached) return { ...p, ...cached };
  const url = `https://raw.githubusercontent.com/${p.repo}/${p.branch}/${p.pluginJsonPath}`;
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error();
    const m = await res.json();
    const data = {
      pending: false,
      name: m.name || p.id,
      version: m.version || null,
      description: m.description || '',
      license: m.license || 'unknown'
    };
    cacheSet(cacheKey, data);
    return { ...p, ...data };
  } catch {
    return {
      ...p,
      pending: true,
      name: p.id,
      version: null,
      description: '',
      license: 'unknown'
    };
  }
};

// ────────────────────────────────────────────────────────────────────────
// Auto-discovery: scan the plugin's git tree to list skills/commands/agents.
// Uses api.github.com (rate-limited 60/h/IP unauth) - cached 1h client-side.
// Failure mode: returns null, render goes degraded silently.
// ────────────────────────────────────────────────────────────────────────
const fetchPluginTree = async (p) => {
  const cacheKey = `tree:${p.repo}@${p.branch}`;
  const cached = cacheGet(cacheKey);
  if (cached) return cached;
  const url = `https://api.github.com/repos/${p.repo}/git/trees/${p.branch}?recursive=1`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const json = await res.json();
    const prefix = pluginPrefix(p);
    const skillRe = new RegExp(`^${escapeRegex(prefix)}skills/([^/]+)/SKILL\\.md$`);
    const cmdRe   = new RegExp(`^${escapeRegex(prefix)}commands/([^/]+)\\.md$`);
    const agentRe = new RegExp(`^${escapeRegex(prefix)}agents/([^/]+)\\.md$`);
    const skills = [], commands = [], agents = [];
    for (const node of (json.tree || [])) {
      if (node.type !== 'blob') continue;
      let m;
      if ((m = skillRe.exec(node.path)))  skills.push(m[1]);
      else if ((m = cmdRe.exec(node.path))) commands.push(m[1]);
      else if ((m = agentRe.exec(node.path))) agents.push(m[1]);
    }
    skills.sort(); commands.sort(); agents.sort();
    const data = { skills, commands, agents };
    cacheSet(cacheKey, data);
    return data;
  } catch {
    return null;
  }
};

// ────────────────────────────────────────────────────────────────────────
// Render
// ────────────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const num2 = (n) => String(n).padStart(2, '0');

const renderSubcmd = (cmd, key) => `
  <div class="subcmd" id="${key}">
    <button class="cmd" data-copy="${esc(cmd)}" data-host="${key}" aria-label="Copy: ${esc(cmd)}" type="button">${esc(cmd)}</button>
    <button class="copy-btn" data-copy="${esc(cmd)}" data-host="${key}" type="button">copy</button>
  </div>`;

const renderSetup = (p) => {
  if (!p.setup) return '';
  const subs = p.setup.commands
    .map((c, i) => renderSubcmd(c, `${p.id}-sub-${i}`))
    .join('');
  return `
    <details class="setup">
      <summary>${esc(p.setup.summary)}</summary>
      <div class="setup-body">
        ${p.setup.noteTop ? `<p class="setup-note">${esc(p.setup.noteTop)}</p>` : ''}
        ${subs}
        ${p.setup.noteBottom ? `<p class="setup-note">${esc(p.setup.noteBottom)}</p>` : ''}
      </div>
    </details>`;
};

const renderSpecValue = (v) => {
  if (Array.isArray(v)) return v.map((x) => `<code>${esc(x)}</code>`).join('');
  return esc(v);
};

const renderSpecs = (p) => {
  const rows = [];
  if (p.skills?.length)   rows.push(['Skills', p.skills]);
  if (p.commands?.length) rows.push(['Commands', p.commands.map(c => `/${p.id}:${c}`)]);
  if (p.agents?.length)   rows.push(['Agents', p.agents]);
  if (p.staticSpecs) {
    for (const [k, v] of Object.entries(p.staticSpecs)) rows.push([k, v]);
  }
  if (!rows.length) return '';
  const html = rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${renderSpecValue(v)}</dd>`).join('');
  return `<dl class="specs">${html}</dl>`;
};

const renderCtas = (c) => {
  const items = [];
  if (c.project) items.push(`<a class="primary" href="${esc(c.project)}" target="_blank" rel="noopener">Open project</a>`);
  if (c.readme)  items.push(`<a class="secondary" href="${esc(c.readme)}" target="_blank" rel="noopener">Readme</a>`);
  if (c.docs)    items.push(`<a class="secondary" href="${esc(c.docs)}" target="_blank" rel="noopener">Docs site</a>`);
  return `<div class="cta-row">${items.join('')}</div>`;
};

const renderMetarow = (p) => {
  const parts = [];
  parts.push(`<span class="badge ${esc(p.kind.tone)}" title="${esc(p.kind.title)}">${esc(p.kind.label)}</span>`);
  if (p.pending) parts.push(`<span class="badge pending">repo pending</span>`);
  if (!p.pending && p.version) {
    parts.push(`<span>v ${esc(p.version)}</span>`);
    parts.push(`<span class="sep">·</span>`);
  }
  parts.push(`<span>${esc(p.license)}</span>`);
  // Counts derived from auto-discovery; silent if unavailable
  const counts = [];
  if (p.skills?.length)   counts.push(`<b>${p.skills.length}</b> skills`);
  if (p.commands?.length) counts.push(`<b>${p.commands.length}</b> commands`);
  if (p.agents?.length)   counts.push(`<b>${p.agents.length}</b> agents`);
  if (counts.length) {
    parts.push(`<span class="sep">·</span>`);
    parts.push(`<span>${counts.join(' · ')}</span>`);
  }
  return `<div class="metarow">${parts.join('')}</div>`;
};

const renderPlugin = (p, i) => {
  const slug = p.id.replace(/[^a-z0-9]/gi, '-');
  const installCmd = `/plugin install ${p.name}@enix`;
  const ctas = {
    project: `https://github.com/${p.repo}`,
    readme:  `https://github.com/${p.repo}#readme`,
    docs:    p.docsUrl || null
  };
  return `
    <article class="plugin" aria-labelledby="p-${slug}">
      <div class="gutter">
        <div class="num">${num2(i + 1)}${p.pending ? `<small>build in progress</small>` : ''}</div>
      </div>
      <div class="body">
        <h2 id="p-${slug}">${esc(p.name).replace('-', '<wbr>-')}</h2>
        ${renderMetarow(p)}
        ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
        <div class="install" id="${slug}-install">
          <button class="cmd" data-copy="${esc(installCmd)}" data-host="${slug}-install" aria-label="Copy: ${esc(installCmd)}" type="button">${esc(installCmd)}</button>
          <button class="copy-btn" data-copy="${esc(installCmd)}" data-host="${slug}-install" type="button">copy</button>
        </div>
        ${renderSetup({ ...p, id: slug })}
        ${renderSpecs(p)}
        ${renderCtas(ctas)}
      </div>
    </article>`;
};

// ────────────────────────────────────────────────────────────────────────
// Copy buttons (called after the async render mounts the cards)
// ────────────────────────────────────────────────────────────────────────
const attachCopyListeners = () => {
  const flash = (el) => {
    const host = el.dataset.host ? document.getElementById(el.dataset.host) : el;
    const target = host || el;
    target.classList.add('copied');
    setTimeout(() => target.classList.remove('copied'), 1500);
  };
  document.querySelectorAll('[data-copy]').forEach((btn) => {
    if (btn.dataset.copyBound) return;
    btn.dataset.copyBound = '1';
    btn.addEventListener('click', async () => {
      const text = btn.getAttribute('data-copy');
      try {
        await navigator.clipboard.writeText(text);
        flash(btn);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); flash(btn); } catch {}
        document.body.removeChild(ta);
      }
    });
  });
};

// ────────────────────────────────────────────────────────────────────────
// Init: fetch manifests + trees in parallel, render cards, attach listeners
// ────────────────────────────────────────────────────────────────────────
(async () => {
  const enriched = await Promise.all(plugins.map(async (p) => {
    const manifest = await fetchPluginManifest(p);
    if (manifest.pending) return manifest; // skip tree if repo unreachable
    const tree = await fetchPluginTree(p);  // null if API fails or rate-limited
    return tree ? { ...manifest, ...tree } : manifest;
  }));
  const mount = document.getElementById('catalogue');
  mount.innerHTML = enriched.map(renderPlugin).join('');
  document.querySelectorAll('[data-count]').forEach((el) => {
    el.textContent = num2(enriched.length);
  });
  attachCopyListeners();
})();

// ────────────────────────────────────────────────────────────────────────
// View toggle (detail / list / grid)
// ────────────────────────────────────────────────────────────────────────
(() => {
  const root = document.documentElement;
  const toggle = document.getElementById('view-toggle');
  if (!toggle) return;
  const opts = toggle.querySelectorAll('[data-view-set]');
  const sync = () => {
    const stored = localStorage.getItem('view') || 'detail';
    opts.forEach((o) => o.classList.toggle('active', o.dataset.viewSet === stored));
  };
  const apply = (mode) => {
    if (mode === 'detail') {
      localStorage.removeItem('view');
      root.removeAttribute('data-view');
    } else {
      localStorage.setItem('view', mode);
      root.setAttribute('data-view', mode);
    }
    sync();
  };
  toggle.addEventListener('click', (e) => {
    const target = e.target.closest('[data-view-set]');
    if (target) apply(target.dataset.viewSet);
  });
  sync();
})();
</script>

</body>
</html>
